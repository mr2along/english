name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - feature/english-lab-v21
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate application
        run: python -m py_compile app.py

      - name: Deploy with Hugging Face Trusted Publisher
        env:
          HF_OIDC_RESOURCE: spaces/Mrlongpro/autosubs
        run: |
          hf upload Mrlongpro/autosubs . \
            --repo-type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --commit-message="Deploy Tactiq Playwright from V21 ${GITHUB_SHA::7}"
